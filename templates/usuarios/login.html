<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  {% load static %}
  {% load custom_filters %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    /* ===============================
       THEME (AUTO LIGHT / DARK)
       =============================== */
    :root {
      --glass-bg: rgba(255,255,255,0.65);
      --glass-border: rgba(255,255,255,0.9);
      --text-main: #374151;
      --bg-main: #e9eef7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --glass-bg: rgba(20,20,25,0.55);
        --glass-border: rgba(255,255,255,0.25);
        --text-main: #e5e7eb;
        --bg-main: #0b0f1a;
      }
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ===============================
       WEBGL / CANVAS LIQUID BACKGROUND
       =============================== */
    canvas#liquid-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===============================
       GLASS CARD
       =============================== */
    .liquid-glass {
      position: relative;
      background: linear-gradient(
        145deg,
        var(--glass-bg),
        rgba(255,255,255,0.35)
      );
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 36px;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 70px 140px rgba(0,0,0,0.25),
        inset 0 2px 4px rgba(255,255,255,0.6),
        inset 0 -20px 50px rgba(255,255,255,0.35);
      animation: enter 1s cubic-bezier(.2,.8,.2,1);
      overflow: hidden;
    }

    /* Refração dinâmica */
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at var(--mx) var(--my),
        rgba(255,255,255,0.6),
        transparent 45%);
      pointer-events: none;
      transition: all 0.15s ease;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===============================
       INPUTS
       =============================== */
    .liquid-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      color: var(--text-main);
    }

    .liquid-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.35);
    }
  </style>
</head>

<body x-data
      @mousemove="
        document.documentElement.style.setProperty('--mx', $event.clientX + 'px');
        document.documentElement.style.setProperty('--my', $event.clientY + 'px');
      ">

  <!-- IMAGEM DE FUNDO -->
  <div class="fixed inset-0 z-0 bg-cover bg-center"
       style="background-image: url('{% static 'images/logo-fundo.png' %}');
       background-size: 60%;
       background-position: center;
       background-repeat: no-repeat;
       filter: blur(1.5px);">
  </div>

  <!-- CAMADA DE PROFUNDIDADE -->
  <div class="fixed inset-0 z-0 bg-white/30 dark:bg-black/40 backdrop-blur-sm"></div>

  <!-- LIQUID EFFECT -->
  <canvas id="liquid-canvas"></canvas>

  <!-- LOGIN -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4">
    <section class="w-full max-w-md p-10 liquid-glass">

      <h2 class="text-3xl font-semibold text-center mb-8">
        Login
      </h2>

      <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
          <label class="text-sm mb-1 block">Usuário</label>
          {{ form.username|add_class:"liquid-input" }}
        </div>

        <div x-data="{ show:false }">
          <label class="text-sm mb-1 block">Senha</label>
          <div class="relative">
            <input
              :type="show ? 'text' : 'password'"
              name="{{ form.password.html_name }}"
              id="{{ form.password.id_for_label }}"
              class="liquid-input pr-12"
              required>
            <button type="button"
              @click="show=!show"
              class="absolute inset-y-0 right-4 text-gray-500 hover:text-gray-700">
              <i data-feather="eye"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full py-3 rounded-2xl font-medium text-white
                 bg-gradient-to-r from-blue-500 to-indigo-500
                 hover:opacity-90 transition shadow-xl flex items-center justify-center gap-2">
          Entrar
          <i data-feather="arrow-right"></i>
        </button>
      </form>

    </section>
  </div>

  <!-- LIQUID CANVAS SCRIPT -->
  <script>
    const canvas = document.getElementById('liquid-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, t = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
      t += 0.01;
      ctx.clearRect(0, 0, w, h);

      const gradient = ctx.createRadialGradient(
        w * 0.5 + Math.sin(t) * 200,
        h * 0.5 + Math.cos(t) * 200,
        100,
        w * 0.5,
        h * 0.5,
        w
      );

      gradient.addColorStop(0, 'rgba(120,160,255,0.25)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      requestAnimationFrame(draw);
    }
    draw();
    feather.replace();
  </script>

</body>
</html>
